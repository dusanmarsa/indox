name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel in-flight runs on the same branch when a newer commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Deterministic values for the build step. The Next.js build doesn't
      # connect to Postgres, but Prisma's generated client and downstream
      # imports read these at module-load time. Anything well-formed works.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      OPENAI_API_KEY: sk-ci-not-a-real-key
      ADAPTER_TOKEN_KEY: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
      BETTER_AUTH_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock*') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (web only — other packages have no lint script yet)
        run: bun --filter @indox/web lint

      - name: Build
        run: bun run build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun audit
