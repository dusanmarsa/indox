# Railway config for the sync worker.
# In Railway: Settings → Service → Config-as-Code → Config Path = packages/worker/railway.toml
#
# Keep at 1 replica unless pg-boss job locking has been verified under
# parallel consumers — accidental concurrent sync wastes upstream API quota.

[build]
builder = "NIXPACKS"
buildCommand = "bun install --frozen-lockfile && bun run db:generate"

[deploy]
startCommand = "bun --filter @indox/worker start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
